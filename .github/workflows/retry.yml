name: 国内重试 / 京东回填
# 每 30 分钟：补当天没采到的国内频道，往前回填京东历史。只写数据，不发布网站（每天 19:00 那次统一发布）
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Vancouver
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 国内重试
        run: python scraper/smzdm_retry.py
      - name: 保存数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "国内重试 $(date '+%F %H:%M')"
          git pull --rebase -X ours || true
          git push
