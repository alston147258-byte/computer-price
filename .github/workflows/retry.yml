name: 国内重试 / 京东回填
# 每 30 分钟：补当天没采到的国内频道，往前回填京东历史。只写数据，不发布网站（每天 19:00 那次统一发布）
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Vancouver
      PYTHONUTF8: '1'
    steps:
      # 取开始运行时最新的 main（排队期间另一个任务可能已经提交了数据），不是触发时的旧版本
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 国内重试
        run: python scraper/smzdm_retry.py
      - name: 更新进度页
        run: python scraper/write_status.py
      - name: 保存数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data README.md
          git diff --cached --quiet && exit 0
          git commit -m "国内重试 $(date '+%F %H:%M')"
          # rebase 时 -X theirs = 冲突处保留本次运行的结果（本次是从最新 main 开始的，包含之前所有数据）
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
